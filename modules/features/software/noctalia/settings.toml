[nightlight]
enabled = true

[notification]
background_opacity = 0.79999998211860657
layer = "overlay"
offset_y = 10
scale = 0.90000000000000002

[osd.kinds]
lock_keys = false

[plugins]
enabled = []

[shell]
avatar_path = "${NOCTALIA_HOME}/avatar.png"
font_family = "Ubuntu Sans"
lang = "en"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
ui_scale = 1.05

    [shell.animation]
    speed = 0.69999999999999996

    [shell.panel]
    open_near_click_session = true
    open_near_click_wallpaper = true
    transparency_mode = "glass"

    [shell.shadow]
    direction = "center"

[theme]
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "qt" ]
    community_ids = [
        "spicetify",
        "zen-browser",
        "neovim",
        "obsidian",
        "vscode",
        "zed",
        "vicinae",
        "discord",
        "papirus-icons",
        "yazi"
    ]

[wallpaper]
directory = "${NOCTALIA_HOME}/Pictures/Wallpapers"

    [wallpaper.default]
    path = "${NOCTALIA_HOME}/Pictures/Wallpapers/call-of-duty-3840x2160-21037.jpeg"

    [wallpaper.last]
    path = "${NOCTALIA_HOME}/Pictures/Wallpapers/call-of-duty-3840x2160-21037.jpeg"

    [wallpaper.monitors.eDP-1]
    path = "${NOCTALIA_HOME}/Pictures/Wallpapers/call-of-duty-3840x2160-21037.jpeg"

[widget.clock]
format = "{:%H:%M %a, %B %d}"

[widget.control-center]
glyph = "navigation-filled"

[widget.media]
hide_when_no_media = true
max_length = 200
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.tray]
anchor = true

[widget.workspaces]
capsule_radius = 4